[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-hallucination-sdk"
version = "0.1.0"
description = "Python SDK for legal domain LLM hallucination detection API"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "HALO Team", email = "team@example.com" }
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools]
packages = ["legal_hallucination_sdk"]

[tool.setuptools.package-data]
legal_hallucination_sdk = ["py.typed"]
