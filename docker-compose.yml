version: '3.9'

services:
  # PostgreSQL Database (Knowledge Base + Analytics)
  postgres:
    image: postgres:15-alpine
    container_name: halo-postgres
    environment:
      POSTGRES_USER: halo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-halo_password}
      POSTGRES_DB: halo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halo_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: halo-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://halo_user:${POSTGRES_PASSWORD:-halo_password}@postgres:5432/halo_db
      JUDGE_MODEL: ${JUDGE_MODEL:-claude-3-opus}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api-and-sdk:/app/api-and-sdk
    command: python run_api.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Redis (Optional: for caching)
  redis:
    image: redis:7-alpine
    container_name: halo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - cache

  # Qdrant Vector Database (Optional: alternative to FAISS)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: halo-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    profiles:
      - vectors

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  default:
    name: halo_network
